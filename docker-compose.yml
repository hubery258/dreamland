version: "3.8"

# ============================================
# Dreamland 博客容器编排
# 两个服务：backend（FastAPI）+ frontend（Nginx）
# 共享同一个 Docker 内部网络
# ============================================

services:
  # ---------- 后端 ----------
  backend:
    build:
      context: ./backend
    container_name: dreamland-backend
    volumes:
      # 把宿主机 backend/data/ 挂载到容器 /app/data/
      # blog.db 存放在这里，容器删了数据不丢
      - ./backend/data:/app/data
    env_file:
      # 从宿主机注入环境变量（ADMIN_SECRET 等密钥不进镜像）
      - ./backend/.env
    restart: unless-stopped

  # ---------- 前端 ----------
  frontend:
    build:
      context: ./frontend
    container_name: dreamland-frontend
    ports:
      # 宿主机 80 → 容器 80
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
