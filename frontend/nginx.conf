# Nginx 配置（容器内使用）
# 作用：
#   1. HTTP 自动跳转 HTTPS
#   2. 托管前端静态文件（React SPA）
#   3. 把 /posts/ /tags/ /site/ 开头的请求转发给后端容器

# HTTP → 重定向到 HTTPS
server {
    listen 80;
    server_name blog.ramenboy.cc;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name blog.ramenboy.cc;

    ssl_certificate     /etc/letsencrypt/live/blog.ramenboy.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.ramenboy.cc/privkey.pem;

    # 前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
    }

    # 后端 API 代理
    location /posts/ {
        proxy_pass http://backend:8000/posts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tags/ {
        proxy_pass http://backend:8000/tags/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /site/ {
        proxy_pass http://backend:8000/site/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
