# Nginx 配置（容器内使用）
# 作用：
#   1. 托管前端静态文件（React SPA）
#   2. 把 /posts/ /tags/ /site/ 开头的请求转发给后端容器

server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;   # SPA 路由回退
    }

    # 后端 API 代理
    # "backend" 是 docker-compose 中的服务名，Docker 内部 DNS 自动解析
    location /posts/ {
        proxy_pass http://backend:8000/posts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /tags/ {
        proxy_pass http://backend:8000/tags/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /site/ {
        proxy_pass http://backend:8000/site/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
